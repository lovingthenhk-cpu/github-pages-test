<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#111426">
<title>放課後、君と境界線。— Campus Visual Novel</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app" id="app">
  <div class="bg" id="bg"></div>
  <div class="vignette"></div>

  <div class="characters">
    <img id="charL" class="char left" alt="">
    <img id="charC" class="char center" alt="">
    <img id="charR" class="char right" alt="">
  </div>

  <header class="topbar">
    <div class="chapter" id="chapter">Prologue</div>
    <div class="quick">
      <button id="qsave">Q.SAVE</button>
      <button id="qload">Q.LOAD</button>
      <button data-open="save">SAVE</button>
      <button data-open="load">LOAD</button>
      <button data-open="menu">MENU</button>
    </div>
  </header>

  <aside class="aff" id="affBox">
    <div class="affRow"><span>澪</span><div class="meter"><i class="mioMeter" id="mioMeter"></i></div><b id="mioAff">0</b></div>
    <div class="affRow"><span>朱莉</span><div class="meter"><i class="akariMeter" id="akariMeter"></i></div><b id="akariAff">0</b></div>
  </aside>

  <div class="choices" id="choices"></div>

  <section class="dialogue" id="dialogue" aria-live="polite">
    <div class="nameplate" id="speaker">Narration</div>
    <div class="dialogActions">
      <button id="autoBtn">AUTO</button>
      <button id="skipBtn">SKIP</button>
      <button data-open="backlog">LOG</button>
    </div>
    <div class="text" id="text"></div>
    <div class="next">▼</div>
  </section>

  <div class="toast" id="toast"></div>

  <section class="screen" id="titleScreen">
    <div class="titleCard">
      <div class="subtitle">CAMPUS ROMANCE VISUAL NOVEL</div>
      <h1 class="logo">放課後、<span>君と境界線。</span></h1>
      <p class="lead">二十歳の秋。大学祭を一週間後に控えた放送研究会で、<br>あなたは二人の先輩と一本の短編ラジオドラマを作ることになる。</p>
      <div class="menuBtns">
        <button class="primary" id="newGame">NEW GAME</button>
        <button id="continueBtn">CONTINUE</button>
        <button data-open="load">LOAD</button>
        <button data-open="gallery">MEMORIES</button>
        <button data-open="profiles">PROFILE</button>
        <button data-open="achievements">ACHIEVEMENTS</button>
        <button data-open="settings">SETTINGS</button>
        <button data-open="credits">CREDITS</button>
      </div>
      <div class="titleNote">全登場人物は成人の大学生です / セーブデータはこのブラウザに保存されます</div>
    </div>
  </section>

  <div class="modal" id="modal" hidden>
    <div class="modalBox">
      <div class="modalHead"><h2 id="modalTitle"></h2><button class="close" id="closeModal">閉じる</button></div>
      <div id="modalBody"></div>
    </div>
  </div>
</main>
<script src="story.js"></script>
<script src="game.js"></script>
</body>
</html>
