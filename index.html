<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#090d18">
<title>Orbit Panic — 1ボタン軌道ゲーム</title>
<style>
  :root{color-scheme:dark;--bg:#090d18;--panel:#111827cc;--text:#eef2ff;--muted:#9ca3af;--accent:#8b5cf6;--cyan:#22d3ee;--danger:#fb7185}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% 35%,#172554 0,#0b1020 38%,#05070d 100%);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overscroll-behavior:none}
  body{min-height:100svh;display:grid;place-items:center;padding:max(14px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom));touch-action:manipulation}
  .wrap{width:min(760px,100%);display:grid;gap:10px}
  .top{display:flex;align-items:end;justify-content:space-between;gap:14px;padding:0 4px}
  h1{font-size:clamp(20px,5vw,34px);line-height:1;margin:0;letter-spacing:.08em;text-transform:uppercase}
  .sub{margin:6px 0 0;color:var(--muted);font-size:13px}
  .scorebox{display:flex;gap:14px;text-align:right;font-variant-numeric:tabular-nums}
  .stat b{display:block;font-size:22px;line-height:1}.stat span{font-size:10px;color:var(--muted);letter-spacing:.12em}
  .game{position:relative;aspect-ratio:1/1;max-height:76svh;border:1px solid #ffffff1d;border-radius:24px;overflow:hidden;background:#070b14;box-shadow:0 24px 80px #0008,inset 0 0 70px #3b82f611;isolation:isolate}
  canvas{display:block;width:100%;height:100%}
  .hud{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;padding:24px;text-align:center}
  .card{pointer-events:auto;max-width:410px;padding:22px 22px 18px;border:1px solid #ffffff22;border-radius:20px;background:#0b1020d9;backdrop-filter:blur(12px);box-shadow:0 14px 45px #0008}
  .card[hidden]{display:none}
  .eyebrow{font-size:11px;letter-spacing:.2em;color:var(--cyan);font-weight:800}
  .card h2{margin:7px 0 8px;font-size:clamp(25px,7vw,42px)}
  .card p{margin:7px 0;color:#cbd5e1;line-height:1.55;font-size:14px}
  button{margin-top:12px;min-height:48px;padding:0 22px;border:0;border-radius:999px;background:linear-gradient(135deg,#7c3aed,#0891b2);color:white;font:inherit;font-weight:800;letter-spacing:.04em;box-shadow:0 8px 30px #6d28d944;cursor:pointer}
  button:active{transform:translateY(1px)}
  .hint{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:12px;padding:0 5px}
  .kbd{padding:2px 7px;border:1px solid #ffffff25;border-bottom-width:2px;border-radius:6px;background:#ffffff0b;color:#e5e7eb}
  .flash{position:absolute;inset:0;background:white;opacity:0;pointer-events:none;mix-blend-mode:screen}
  @media(max-width:520px){
    .top{align-items:center}.sub{display:none}.scorebox{gap:10px}.stat b{font-size:18px}.game{border-radius:18px}
    .hint{justify-content:center}.hint span:last-child{display:none}
  }
  @media(prefers-reduced-motion:reduce){button{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><h1>Orbit Panic</h1><p class="sub">反転だけで生き残れ。重力圏ワンタップ・サバイバル。</p></div>
    <div class="scorebox">
      <div class="stat"><b id="score">0</b><span>SCORE</span></div>
      <div class="stat"><b id="best">0</b><span>BEST</span></div>
    </div>
  </div>

  <div class="game" id="game" tabindex="0" aria-label="Orbit Panic ゲーム画面。タップまたはSpaceで周回方向を反転します。">
    <canvas id="c"></canvas>
    <div class="flash" id="flash"></div>
    <div class="hud">
      <section class="card" id="startCard">
        <div class="eyebrow">ONE BUTTON GAME</div>
        <h2>軌道を反転せよ</h2>
        <p>あなたはブラックホールの周囲を自動で周回します。<br><strong>タップ / クリック / Space</strong> で回転方向を反転。</p>
        <p>赤い隕石を避け、青いエネルギー片を拾ってスコアを伸ばしてください。</p>
        <button id="startBtn" type="button">START</button>
      </section>
      <section class="card" id="overCard" hidden>
        <div class="eyebrow">SIGNAL LOST</div>
        <h2 id="finalScore">0</h2>
        <p id="resultText">重力圏に飲まれました。</p>
        <button id="retryBtn" type="button">RETRY</button>
      </section>
    </div>
  </div>

  <div class="hint">
    <span><span class="kbd">SPACE</span> / TAP：反転</span>
    <span>エネルギー片 +120 ・ 生存時間で加点</span>
  </div>
</div>

<script>
(() => {
  'use strict';
  const root = document.getElementById('game');
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const startCard = document.getElementById('startCard');
  const overCard = document.getElementById('overCard');
  const finalScore = document.getElementById('finalScore');
  const resultText = document.getElementById('resultText');
  const flash = document.getElementById('flash');

  let dpr=1,w=600,h=600,cx=300,cy=300,scale=1;
  let running=false,last=0,t=0,score=0,best=0,dir=1,angle=-Math.PI/2;
  let playerR=190,speed=1.32,spawnClock=0,orbClock=1.2,shake=0;
  let obstacles=[],orbs=[],stars=[];
  let raf=0,audioCtx=null;

  try { best = Number(localStorage.getItem('orbit-panic-best')||0) || 0; } catch (_) {}
  bestEl.textContent=best;

  function resize(){
    const r=canvas.getBoundingClientRect();
    dpr=Math.min(window.devicePixelRatio||1,2);
    canvas.width=Math.max(1,Math.round(r.width*dpr));
    canvas.height=Math.max(1,Math.round(r.height*dpr));
    w=r.width; h=r.height; cx=w/2; cy=h/2; scale=Math.min(w,h)/600;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    makeStars();
  }
  function makeStars(){
    const n=Math.max(50,Math.floor((w*h)/6500));
    stars=Array.from({length:n},()=>({x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.4+.2,a:Math.random()*.7+.2}));
  }
  function reset(){
    running=true; last=performance.now(); t=0; score=0; dir=1; angle=-Math.PI/2; speed=1.32;
    spawnClock=.4; orbClock=1.3; shake=0; obstacles=[]; orbs=[];
    scoreEl.textContent='0'; startCard.hidden=true; overCard.hidden=true;
    root.focus({preventScroll:true});
    cancelAnimationFrame(raf); raf=requestAnimationFrame(loop);
  }
  function tone(freq,dur=.06,vol=.025,type='sine'){
    try{
      audioCtx ||= new (window.AudioContext||window.webkitAudioContext)();
      const o=audioCtx.createOscillator(),g=audioCtx.createGain();
      o.frequency.value=freq;o.type=type;g.gain.setValueAtTime(vol,audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+dur);
      o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+dur);
    }catch(_){}
  }
  function flip(){
    if(!running) return;
    dir*=-1; shake=Math.max(shake,2.2); tone(280,.04,.018,'triangle');
  }
  function spawnObstacle(){
    const a=Math.random()*Math.PI*2;
    const width=(.19+Math.random()*.17);
    const rr=playerR + (Math.random()<.45 ? (Math.random()*20-10) : (Math.random()<.5?-38:38));
    obstacles.push({a,rr,width,life:5.3,spin:(Math.random()*.18+.04)*(Math.random()<.5?-1:1),size:18+Math.random()*13});
  }
  function spawnOrb(){
    const a=Math.random()*Math.PI*2;
    orbs.push({a,rr:playerR,life:5,pulse:Math.random()*6.28});
  }
  function angleDiff(a,b){
    let d=(a-b)%(Math.PI*2); if(d>Math.PI)d-=Math.PI*2;if(d<-Math.PI)d+=Math.PI*2;return d;
  }
  function die(){
    running=false; shake=11; tone(90,.35,.05,'sawtooth');
    flash.animate([{opacity:.5},{opacity:0}],{duration:350,easing:'ease-out'});
    const s=Math.floor(score);
    if(s>best){best=s;bestEl.textContent=best;try{localStorage.setItem('orbit-panic-best',String(best));}catch(_){}}
    finalScore.textContent=s.toLocaleString();
    resultText.textContent=s<500?'重力圏はまだあなたを覚えていません。':s<1400?'かなり粘りました。もう一周いけそうです。':s<3000?'軌道制御がだいぶ人間離れしてきました。':'ブラックホール側が避けるべき存在です。';
    setTimeout(()=>{overCard.hidden=false;},260);
  }
  function update(dt){
    t+=dt; speed=Math.min(2.55,1.32+t*.018); angle+=dir*speed*dt;
    score+=dt*(36+t*.18);
    spawnClock-=dt; orbClock-=dt;
    if(spawnClock<=0){spawnObstacle();spawnClock=Math.max(.38,.9-t*.007)*(0.82+Math.random()*.45);}
    if(orbClock<=0){spawnOrb();orbClock=1.55+Math.random()*1.25;}
    for(const o of obstacles){o.a+=o.spin*dt;o.life-=dt;}
    for(const o of orbs){o.life-=dt;o.pulse+=dt*5;}
    obstacles=obstacles.filter(o=>o.life>0);orbs=orbs.filter(o=>o.life>0);
    const px=Math.cos(angle)*playerR,py=Math.sin(angle)*playerR;
    for(const o of obstacles){
      const ox=Math.cos(o.a)*o.rr,oy=Math.sin(o.a)*o.rr;
      const dx=px-ox,dy=py-oy,hit=(o.size+11);
      if(dx*dx+dy*dy<hit*hit){die();break;}
    }
    if(!running)return;
    for(let i=orbs.length-1;i>=0;i--){
      const o=orbs[i];const ox=Math.cos(o.a)*o.rr,oy=Math.sin(o.a)*o.rr;
      const dx=px-ox,dy=py-oy;
      if(dx*dx+dy*dy<28*28){orbs.splice(i,1);score+=120;shake=4;tone(720,.08,.028,'sine');}
    }
    scoreEl.textContent=Math.floor(score);
    shake*=Math.pow(.02,dt);
  }
  function draw(){
    ctx.clearRect(0,0,w,h);
    ctx.save();
    if(shake>.15)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);

    const bg=ctx.createRadialGradient(cx,cy,10,cx,cy,Math.max(w,h)*.62);
    bg.addColorStop(0,'#172554'); bg.addColorStop(.42,'#0b1020'); bg.addColorStop(1,'#03050a');
    ctx.fillStyle=bg;ctx.fillRect(-20,-20,w+40,h+40);
    for(const s of stars){ctx.globalAlpha=s.a*(.65+.35*Math.sin(t*.6+s.x));ctx.fillStyle='#e0f2fe';ctx.beginPath();ctx.arc(s.x,s.y,s.r*scale,0,7);ctx.fill();}
    ctx.globalAlpha=1;

    const R=playerR*scale;
    ctx.save();ctx.translate(cx,cy);
    ctx.strokeStyle='#93c5fd22';ctx.lineWidth=1;ctx.setLineDash([4*scale,9*scale]);ctx.beginPath();ctx.arc(0,0,R,0,7);ctx.stroke();ctx.setLineDash([]);

    for(let i=4;i>=0;i--){
      ctx.fillStyle=`rgba(139,92,246,${.018+i*.013})`;ctx.beginPath();ctx.arc(0,0,(68+i*11)*scale,0,7);ctx.fill();
    }
    const hole=ctx.createRadialGradient(-10*scale,-12*scale,4,0,0,62*scale);
    hole.addColorStop(0,'#000');hole.addColorStop(.55,'#03030a');hole.addColorStop(.72,'#7c3aed');hole.addColorStop(.79,'#22d3ee');hole.addColorStop(.86,'#120b2d');hole.addColorStop(1,'transparent');
    ctx.fillStyle=hole;ctx.beginPath();ctx.arc(0,0,78*scale,0,7);ctx.fill();
    ctx.save();ctx.rotate(t*.16);ctx.strokeStyle='#c4b5fd55';ctx.lineWidth=2*scale;ctx.beginPath();ctx.ellipse(0,0,88*scale,32*scale,.4,0,7);ctx.stroke();ctx.restore();

    for(const o of orbs){
      const x=Math.cos(o.a)*o.rr*scale,y=Math.sin(o.a)*o.rr*scale;
      const rr=(7+Math.sin(o.pulse)*2)*scale;
      ctx.shadowColor='#22d3ee';ctx.shadowBlur=18*scale;ctx.fillStyle='#67e8f9';ctx.beginPath();ctx.arc(x,y,rr,0,7);ctx.fill();ctx.shadowBlur=0;
    }
    for(const o of obstacles){
      const x=Math.cos(o.a)*o.rr*scale,y=Math.sin(o.a)*o.rr*scale,sz=o.size*scale;
      ctx.save();ctx.translate(x,y);ctx.rotate(o.a*2.3+t*.2);
      ctx.shadowColor='#fb7185';ctx.shadowBlur=10*scale;ctx.fillStyle='#881337';ctx.strokeStyle='#fda4af';ctx.lineWidth=1.5*scale;
      ctx.beginPath();
      for(let k=0;k<7;k++){const aa=k/7*Math.PI*2,rad=sz*(.72+((k*37)%10)/35);const xx=Math.cos(aa)*rad,yy=Math.sin(aa)*rad;k?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy);}
      ctx.closePath();ctx.fill();ctx.stroke();ctx.shadowBlur=0;ctx.restore();
    }

    const x=Math.cos(angle)*R,y=Math.sin(angle)*R;
    ctx.save();ctx.translate(x,y);ctx.rotate(angle+(dir>0?Math.PI/2:-Math.PI/2));
    ctx.shadowColor='#a5f3fc';ctx.shadowBlur=16*scale;ctx.fillStyle='#ecfeff';
    ctx.beginPath();ctx.moveTo(0,-13*scale);ctx.lineTo(9*scale,10*scale);ctx.lineTo(0,6*scale);ctx.lineTo(-9*scale,10*scale);ctx.closePath();ctx.fill();
    ctx.shadowBlur=0;ctx.fillStyle='#8b5cf6';ctx.beginPath();ctx.moveTo(-4*scale,8*scale);ctx.lineTo(0,18*scale*(1+Math.random()*.3));ctx.lineTo(4*scale,8*scale);ctx.fill();ctx.restore();

    ctx.restore();ctx.restore();
  }
  function loop(now){
    if(!running){draw();return;}
    const dt=Math.min(.034,Math.max(0,(now-last)/1000));last=now;update(dt);draw();raf=requestAnimationFrame(loop);
  }

  document.getElementById('startBtn').addEventListener('click',e=>{e.stopPropagation();reset();});
  document.getElementById('retryBtn').addEventListener('click',e=>{e.stopPropagation();reset();});
  root.addEventListener('pointerdown',e=>{
    if(e.target.closest('button'))return;
    if(running){e.preventDefault();flip();}
  });
  root.addEventListener('keydown',e=>{
    if(e.code==='Space' && running){e.preventDefault();flip();}
    if((e.code==='Enter'||e.code==='Space')&&!running && (startCard.hidden===false || overCard.hidden===false)){e.preventDefault();reset();}
  });
  window.addEventListener('resize',resize,{passive:true});
  resize();draw();
})();
</script>
</body>
</html>
