<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ChatGPT → Computer Full → GitHub Pages</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f1ec; color: #26221f; }
    main { width: min(92vw, 760px); text-align: center; padding: 32px 16px; }
    img { display: block; width: min(100%, 640px); height: auto; margin: 24px auto; border-radius: 24px; box-shadow: 0 16px 50px #0003; }
    code { background: #0001; padding: .2em .45em; border-radius: .4em; }
    @media (prefers-color-scheme: dark) { body { background: #1d1b19; color: #eee8e1; } code { background: #fff1; } }
  </style>
</head>
<body>
  <main>
    <h1>ChatGPT生成画像のアップロード実験</h1>
    <p>この猫画像はChatGPTで生成し、<code>chatgpt_files_receive</code> でComputer Fullへ転送して、GitHub Pagesへ公開したものです。</p>
    <img src="cat.png" alt="ChatGPTで生成した猫画像">
    <p>転送・Git commit・GitHub Pages配信までの実動作確認用ページです。</p>
  </main>
</body>
</html>
